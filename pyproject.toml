[project]
name = "moltbook-drift"
version = "0.1.0"
description = "Exploring multi-agent induced persona drift with behaviour and mech-interp evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "huggingface-hub>=1.16.1",
    "inspect-ai==0.3.244",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
    "openai>=1.0.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
